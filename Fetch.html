<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(0, 0, 0);
            position: relative;
        }
        h3{
            color: #58791f;
            font-size: 100px;
            position: absolute;
            left: 35%;
            
        }
        button{
           background-color: blueviolet;
           border: 2px solid rgb(255, 243, 243);
           width: 10vw;
           height: 5vh;
           color: white;
           font-family: Georgia, 'Times New Roman', Times, serif;
           font-size: large;
           position: absolute;
           top:300px;
           left:625px;
         

        }
    #data-container{
        position: absolute;
        top: 350px;
        color: rgb(8, 14, 5);
        left: 40px;
        font-size: x-large;
        font-family:sans-serif;
        background-color: #58791f;
    }
        
    </style>
</head>
<body>
    <h3>API DATA</h3>
     <button onclick="getApi()">FETCH API</button>
    <div id="data-container"></div>
    <script>
      function getApi(){
        fetch('https://jsonplaceholder.typicode.com/posts')
        .then(function(responce){
            return responce.json();
        })
        .then(function(data){
       var container=document.getElementById('data-container');
       for(var i=0;i<2;i++){
        var post=document.createElement('div');
        post.innerHTML="<h1>"+data[i].title+"</h1>"+"<p>"+data[i].body+"</p>";
        container.appendChild(post);
       }
        })
        .catch(function(error){
            console.log('ERROR FETCHING THE DATAAAA',error);
            
        })
      }
      
    </script>
</body>
</html>
